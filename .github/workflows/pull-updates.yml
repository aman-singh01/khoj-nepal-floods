name: Pull event data

# Keeps the /updates stream and the enabled person-record feeds fresh on a
# schedule, independent of site traffic.
# Needs a repo secret DATABASE_URL pointing at the production Postgres
# (same one the deployed site uses, schema already migrated).

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: pull-data
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull event updates (news / humanitarian)
        run: npm run updates:pull
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Pull person-record feeds
        run: npm run feeds:pull
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
