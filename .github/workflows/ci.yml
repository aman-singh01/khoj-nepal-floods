name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          # Build with the embedded DB driver; no external services needed.
          DATABASE_URL: ""
          IP_HASH_SALT: ci
          MODERATION_TOKEN: ci-token
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
